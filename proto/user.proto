syntax = "proto3";

package user;

// ── Messages ────────────────────────────────────────────

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string message = 2;
  string user_id = 3;
  string email = 4;
  string role = 5;
  string full_name = 6;
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  bool is_active = 5;
}

// ── Service ─────────────────────────────────────────────

service UserService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser (GetUserRequest) returns (UserResponse);
}
